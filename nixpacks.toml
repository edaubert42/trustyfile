[phases.setup]
# python313 pins the interpreter — without it nixpacks picks its own default,
# which can drift away from what CI actually tested.
#
# caddy is baked in here rather than curl'd at boot by start.sh: that fetched
# an unpinned, unchecksummed binary from caddyserver.com on every container
# start, so the version could drift under us, a bad response would be executed
# unverified, and the app could not boot at all if the download failed. nix
# pins the version and verifies the hash at build time.
nixPkgs = ["python313", "caddy", "tesseract", "zbar", "libdmtx"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

# Deploy gate: a red suite fails the build, so the previous version keeps
# serving instead of shipping broken detection logic. This is a backstop, not
# a replacement for CI — it only fires on deploy, never on a branch or PR.
# Costs ~20s per build.
[phases.build]
cmds = ["pytest tests/ -q"]
