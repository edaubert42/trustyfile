[phases.setup]
# python313 pins the interpreter — without it nixpacks picks its own default,
# which can drift away from what CI actually tested.
#
# NOTE: caddy is deliberately NOT here. Adding it built fine but the binary was
# not on PATH in Railway's runtime image, so start.sh aborted and the site went
# down. Caddy is fetched at boot instead, by Python — see start.sh.
nixPkgs = ["python313", "tesseract", "libdmtx"]

[phases.install]
cmds = ["pip install -r requirements.txt"]

# Deploy gate: a red suite fails the build, so the previous version keeps
# serving instead of shipping broken detection logic. This is a backstop, not
# a replacement for CI — it only fires on deploy, never on a branch or PR.
# Costs ~20s per build.
[phases.build]
cmds = ["pytest tests/ -q"]
