[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = false
enableXsrfProtection = false
baseUrlPath = ""
enableWebsocketCompression = false

# Mobile upload reliability.
#
# Symptom this fixes: on a real phone, the first upload silently does nothing
# (uploader sits empty, no reconnect banner) and only the second attempt works.
#
# Cause: tapping "browse" opens the system file picker, which backgrounds the
# page. The mobile OS / carrier NAT drops the websocket's TCP connection
# without sending a FIN, leaving a half-open socket — the browser still
# believes it is connected. Streamlit's frontend then sends its
# UploadFileUrlsRequest into a dead pipe and waits forever: no upload URL, no
# POST, no error shown.
#
# websocketPingInterval sends a heartbeat every N seconds, which is what
# actually detects a half-open socket and triggers reconnection. Without it
# (the default, None) nothing ever probes the connection.
websocketPingInterval = 20
# Once the socket does drop, keep the server-side session alive long enough
# that the reconnect resumes it instead of starting a fresh one. The default
# (120s) is easily exceeded by picking a file out of iCloud/Drive.
disconnectedSessionTTL = 900

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#4a90e2"
