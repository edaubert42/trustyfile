name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      # Don't let one version's failure cancel the others — we want the full
      # picture, especially to tell "3.14 only" breakage from a real regression.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # System libraries the Python wrappers bind to:
      #   tesseract-ocr(-fra) -> pytesseract (OCR fallback, French docs)
      #   libdmtx-dev         -> pylibdmtx (2D-Doc DataMatrix decoding)
      # libdmtx-dev rather than the runtime package because the runtime name
      # churns across Ubuntu releases (libdmtx0b -> libdmtx0t64 in 24.04);
      # the -dev name is stable and pulls the runtime lib in.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-fra libdmtx-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # NOTE: this is ~760 tests, not the ~888 that run locally. The corpus-
      # driven gates (test_corpus_bands, test_coverage_gate, test_overlay_*)
      # parametrize over samples/, which is gitignored because it holds real
      # documents. With no corpus the parametrize list is empty, so those cases
      # generate silently rather than reporting as skips. The zero-FP corpus
      # gates therefore still only run locally — green here is not full cover.
      - name: Run test suite
        run: pytest tests/ -q

  # The Caddyfile is the only piece of the deployment nothing else checks:
  # start.sh downloads Caddy at boot and a Caddyfile that does not parse
  # takes the whole site down with it (the pytest job never touches it).
  # Same download URL as start.sh, so this validates with the binary that
  # will actually run it.
  caddyfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Caddyfile
        env:
          PORT: "8080"
        run: |
          curl -sSL "https://caddyserver.com/api/download?os=linux&arch=amd64" -o caddy
          chmod +x caddy
          ./caddy validate --config Caddyfile --adapter caddyfile
