name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs on any branch (`gh workflow run tests.yml --ref <branch>`):
  # feature branches are merged locally rather than through PRs here, so
  # without this nothing could exercise CI before a merge to main deploys.
  workflow_dispatch:

jobs:
  # Everything runs inside the image built from the Dockerfile, the same
  # recipe Railway builds production from: same Debian, same Python, same
  # system libraries, same Caddy. The runner itself installs nothing.
  image:
    name: image (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # Don't let one version's failure cancel the other: we want to tell
      # "3.14 only" breakage from a real regression.
      fail-fast: false
      matrix:
        include:
          # Exactly what production runs: the Dockerfile's default Python.
          - label: production
            python-image: ""
            smoke: true
          # The next upgrade. Same Dockerfile, only the base image changes.
          - label: python 3.14
            python-image: python:3.14.10-slim-trixie
            smoke: false

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Layers are cached in the GitHub Actions cache, one scope per Python:
      # a code-only change rebuilds the last few layers, not apt and pip.
      # A warm cache also means the Debian archive is not contacted at all.
      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: trustyfile:test
          build-args: ${{ matrix.python-image && format('PYTHON_IMAGE={0}', matrix.python-image) || '' }}
          cache-from: type=gha,scope=${{ matrix.label }}
          cache-to: type=gha,mode=max,scope=${{ matrix.label }}

      # NOTE: ~1900 tests, not the ~2450 that run locally with the corpus.
      # The detection-quality gates (test_corpus_bands, test_corpus_types,
      # test_coverage_gate...) read samples/, which never enters the build
      # context (.dockerignore) because it holds real documents. Here they
      # skip, and tests/conftest.py ends the log with a CORPUS ABSENT
      # warning. Green here is not full cover.
      - name: Run the test suite in the image
        run: docker run --rm trustyfile:test

      # The image Railway deploys (last stage of the Dockerfile). Its layers
      # are the test image's minus the test ones, so this is a cache hit.
      - name: Build the production image
        if: matrix.smoke
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: trustyfile:runtime
          cache-from: type=gha,scope=${{ matrix.label }}

      # Boot the production image the way Railway does (CMD = start.sh) and
      # hit it from outside: Caddy starts and parses the Caddyfile, serves
      # the static pages, proxies the app, the API analyses the sample PDF
      # with a key made through the admin route (a throwaway key database
      # and admin token, as on staging). Then check the system libraries
      # some tests silently skip without.
      - name: Smoke test the production image
        if: matrix.smoke
        run: |
          docker run -d --name site -p 8080:8080 \
            -e TRUSTYFILE_API_DB=/tmp/api.db -e TRUSTYFILE_ADMIN_TOKEN=smoke \
            trustyfile:runtime
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/ && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:8080/
          curl -fsS -o /dev/null http://127.0.0.1:8080/en
          curl -fsS -o /dev/null http://127.0.0.1:8080/guides/
          curl -fsS -o /dev/null http://127.0.0.1:8080/robots.txt
          # No key: refused. Then a key from the admin route, and the analysis.
          test "$(curl -s -o /dev/null -w '%{http_code}' -F file=@public/static/demo/facture-exemple.pdf \
            http://127.0.0.1:8080/api/v1/analyze)" = 401
          key=$(curl -fsS -u admin:smoke -H 'Content-Type: application/json' \
            -d '{"name": "smoke", "monthly_quota": 1}' http://127.0.0.1:8080/api/v1/admin/keys \
            | python3 -c "import json, sys; print(json.load(sys.stdin)['secret'])")
          curl -fsS -H "Authorization: Bearer $key" -F file=@public/static/demo/facture-exemple.pdf \
            http://127.0.0.1:8080/api/v1/analyze -o report.json
          python3 -c "import json; r = json.load(open('report.json')); print('band:', r['band'], 'score:', r['trust_score'])"

          # OCR: the tesseract binary, with French
          docker exec site tesseract --list-langs | grep -qx fra
          # 2D-Doc: libdmtx loads and round-trips a DataMatrix
          docker exec site python -c "from pylibdmtx import pylibdmtx as d; from PIL import Image; e = d.encode(b'DC04'); img = Image.frombytes('RGB', (e.width, e.height), e.pixels); assert d.decode(img)[0].data == b'DC04'"
          # Nothing private or test-only in the production image
          docker exec site sh -c 'test ! -e /app/samples && test ! -e /app/tests && test ! -e /app/.git'

      - name: Container logs
        if: always() && matrix.smoke
        run: docker logs site 2>&1 | tail -50 || true

  # The detection-quality gates on the real sample corpus (forgeries stay
  # SUSPICIOUS, no false positive on legitimate documents), which the job
  # above cannot run: samples/ holds real documents and never enters the
  # repository or an image.
  #
  # The corpus lives in the private repository edaubert42/trustyfile-corpus,
  # as one gpg-encrypted tar archive (file names included). This job clones
  # it with a read-only deploy key (CORPUS_DEPLOY_KEY), decrypts it with
  # CORPUS_PASSPHRASE into the runner's temp dir, and mounts it read-only into
  # the test container at run time: it is never built into the image or its
  # cache. GitHub never hands secrets to pull requests from forks.
  #
  # This repository is public, and so are its Actions logs. The file names
  # are the test ids and carry personal names, and a failure message can
  # quote a document. So the pytest output never reaches the log: only the
  # counts line does. Read the details by rerunning locally with the corpus.
  #
  # A pull request that only touches the site (pages, guides, static files,
  # docs) skips the gates and reports success, so this required check never
  # blocks it. Pushes to main and manual runs always run them.
  corpus:
    name: corpus
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this change touch detection?
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Paths that cannot change a verdict (translations: the corpus tests
          # pass with both files emptied). Anything else runs the gates.
          site_only='^(src/web/|src/site/|src/translations/|public/|docs/|tests/test_web_|tests/test_app_|tests/test_api\.py$|tests/test_guides\.py$|scripts/build_guides\.py$|scripts/indexnow\.py$|\.github/workflows/indexnow\.yml$|Caddyfile$|start\.sh$|.*\.md$)'
          others=$(git diff --name-only "$BASE" HEAD | grep -Ev "$site_only" || true)
          if [ -z "$others" ]; then
            echo "Site-only change: corpus gates skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the secrets are available
        if: steps.scope.outputs.run == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.CORPUS_DEPLOY_KEY }}
          PASSPHRASE: ${{ secrets.CORPUS_PASSPHRASE }}
        run: |
          if [ -z "$DEPLOY_KEY" ] || [ -z "$PASSPHRASE" ]; then
            echo "::error::Corpus secrets unavailable (a pull request from a fork?). The corpus gates cannot run."
            exit 1
          fi

      - name: Fetch the encrypted corpus
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: edaubert42/trustyfile-corpus
          ssh-key: ${{ secrets.CORPUS_DEPLOY_KEY }}
          persist-credentials: false
          path: .corpus-encrypted

      - name: Decrypt it outside the build context
        if: steps.scope.outputs.run == 'true'
        env:
          PASSPHRASE: ${{ secrets.CORPUS_PASSPHRASE }}
        run: |
          mkdir -p "$RUNNER_TEMP/corpus"
          cat .corpus-encrypted/corpus.tar.gpg.part-* \
            | gpg --batch --quiet --decrypt --passphrase-fd 3 3<<<"$PASSPHRASE" \
            | tar -xf - -C "$RUNNER_TEMP/corpus"
          rm -rf .corpus-encrypted
          echo "PDFs: $(find "$RUNNER_TEMP/corpus/samples" -name '*.pdf' | wc -l)"

      - uses: docker/setup-buildx-action@v3
        if: steps.scope.outputs.run == 'true'

      # Same image as the "production" leg above, from its cache. Read only:
      # that leg writes the cache, two writers on one scope would race.
      - name: Build the test image
        if: steps.scope.outputs.run == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: trustyfile:test
          cache-from: type=gha,scope=production

      - name: Run the corpus gates (counts only in the log)
        if: steps.scope.outputs.run == 'true'
        run: |
          set +e
          docker run --rm \
            -v "$RUNNER_TEMP/corpus/samples:/app/samples:ro" \
            -e TRUSTYFILE_REQUIRE_CORPUS=1 \
            trustyfile:test python -m pytest tests/ -q --no-header -p no:cacheprovider \
            > "$RUNNER_TEMP/pytest.log" 2>&1
          status=$?
          set -e
          # The last line of a -q run: "N passed, M failed, K skipped in Xs".
          # Counts only, no test id: that is all this log may show.
          tail -n 1 "$RUNNER_TEMP/pytest.log" | grep -Eo '[0-9]+ (passed|failed|errors?|skipped|xfailed|xpassed|deselected)' | paste -sd, - || true
          rm -f "$RUNNER_TEMP/pytest.log"
          if [ "$status" -ne 0 ]; then
            echo "::error::Corpus gates failed (pytest exit $status). Details are kept out of this public log: rerun locally with the corpus and TRUSTYFILE_REQUIRE_CORPUS=1."
          fi
          exit "$status"

      - name: Remove the decrypted corpus
        if: always()
        run: rm -rf "$RUNNER_TEMP/corpus" .corpus-encrypted
